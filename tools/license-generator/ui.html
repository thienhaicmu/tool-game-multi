<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WVPT License Generator</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>WVPT License Generator</h1>
        <p>Private offline generator for Aviator Control Studio licenses.</p>
      </div>
      <span id="key-chip" class="chip off">KEY MISSING</span>
    </header>

    <section class="panel">
      <div class="panel-head">
        <b>Private Key</b>
        <button id="choose-key" type="button">Choose key</button>
      </div>
      <div id="key-path" class="path">Loading...</div>
      <div class="hint">Private key stays outside the customer app. Do not commit. Do not ship with customer builds.</div>
    </section>

    <section class="panel form">
      <label>Machine ID
        <input id="machine-id" class="mono" placeholder="WVPT-PC-9F4C-7A18-2D0E-C631">
      </label>

      <div class="grid">
        <label>Duration
          <select id="duration">
            <option value="1">1 day</option>
            <option value="3">3 days</option>
            <option value="7">7 days</option>
            <option value="30">30 days</option>
            <option value="60">60 days</option>
            <option value="90">90 days</option>
            <option value="180">180 days</option>
            <option value="365">365 days</option>
            <option value="custom">Custom expiry date</option>
          </select>
        </label>
        <label id="custom-wrap" hidden>Custom Expiry Date
          <input id="custom-expiry" type="date">
        </label>
      </div>

      <div class="grid">
        <div class="stat"><span>Issued</span><b id="issued">—</b></div>
        <div class="stat"><span>Expires</span><b id="expires">—</b></div>
      </div>

      <div class="grid">
        <label>Launch Limit
          <select id="launch-limit">
            <option value="unlimited">Unlimited</option>
            <option value="10">10 launches</option>
            <option value="30">30 launches</option>
            <option value="100">100 launches</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label id="custom-launch-wrap" hidden>Custom Launches
          <input id="custom-launches" type="number" min="1" max="1000000" step="1" placeholder="50">
        </label>
      </div>

      <button id="generate" class="primary" type="button">GENERATE LICENSE</button>
      <div id="error" class="error" hidden></div>
    </section>

    <section class="panel result">
      <div class="panel-head">
        <b>License Key</b>
        <button id="copy-license" type="button" disabled>Copy</button>
      </div>
      <textarea id="license-output" class="mono" rows="7" readonly></textarea>
      <div class="grid">
        <div class="stat"><span>License ID</span><b id="license-id">—</b></div>
        <div class="stat"><span>Machine</span><b id="license-machine">—</b></div>
        <div class="stat"><span>Launches</span><b id="license-launches">—</b></div>
      </div>
    </section>
  </main>
  <script src="ui.js"></script>
</body>
</html>
