<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Detail</title><link rel="stylesheet" href="desktop.css"><style>body{overflow:auto}.detail-window{min-height:100vh;background:#fff}.detail-scroll{padding:18px;overflow:auto}.detail-window h3{font-size:12px;color:#43545c;border-bottom:1px solid #e7ecee;padding-bottom:7px;margin-top:22px}.detail-window .inspect-head{position:sticky;top:0;background:#fff;z-index:2}.detail-window .inspect-head button,.detail-actions button{border:1px solid #dfe6e9;background:#fff;border-radius:4px;padding:7px 10px;color:#53666e;font-size:10px;cursor:pointer}.detail-actions{display:flex;gap:8px;margin-top:18px}.detail-actions button:last-child{background:#0b9e89;color:#fff;border-color:#0b9e89}.detail-window .mono{display:block;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}.detail-window .scope-row{gap:15px;align-items:start}.detail-window .scope-row span{max-width:70%;text-align:right;word-break:break-word}</style></head><body><main class="detail-window"><div class="inspect-head"><div><div class="eyebrow">REQUEST DETAIL</div><b id="title">Waiting for request…</b></div><button id="mark">Mark for review</button></div><div id="detail" class="detail-scroll"><div class="empty-small">Select a request in the browser window.</div></div></main><script src="request-detail.js"></script></body></html>
