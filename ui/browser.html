<!doctype html><html><head><meta charset="utf-8"><title>Chromium</title><style>html,body{margin:0;height:100%;overflow:hidden;font:13px system-ui;background:#eef2f4}.bar{height:48px;display:flex;gap:6px;align-items:center;padding:0 10px;background:#202b32}.bar button{border:0;border-radius:5px;background:#344650;color:#fff;width:32px;height:30px}.bar input{flex:1;height:30px;border:0;border-radius:5px;padding:0 12px;background:#fff}.view{width:100%;height:calc(100% - 48px);border:0}</style></head><body><div class="bar"><button id="back">‹</button><button id="forward">›</button><button id="reload">↻</button><input id="address" placeholder="Search or enter web address"></div><webview id="view" class="view" partition="persist:observatory-browser" allowpopups></webview><script src="browser.js"></script></body></html>
