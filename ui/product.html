<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebView Debugger</title>
  <link rel="stylesheet" href="product.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="glyph">◇</span><b>WebView Debugger</b></div>
    <div class="connect">
      <input id="host" value="127.0.0.1:9222" title="CDP endpoint host:port">
      <button id="connect">Connect</button>
      <input id="url" placeholder="https://your.app" title="Launch Chrome at URL">
      <button id="launch">Launch Chrome</button>
      <button id="adb" title="Attach Android WebView via adb">ADB</button>
    </div>
    <select id="targets" title="Debug target"><option value="">No targets</option></select>
    <div class="chips">
      <span id="chip-conn" class="chip off">Disconnected</span>
      <span id="chip-cap" class="chip off">Idle</span>
      <span id="chip-intc" class="chip off">Intercept OFF</span>
      <span id="chip-paused" class="chip" hidden>0 paused</span>
    </div>
    <div class="spacer"></div>
    <input id="search" placeholder="Search  (Ctrl+F)  e.g. POST 500 purchase">
    <select id="filter">
      <option value="all">All</option>
      <option value="fetch">Fetch</option>
      <option value="xhr">XHR</option>
      <option value="failed">Failed</option>
      <option value="replayed">Replayed</option>
      <option value="intercepted">Intercepted</option>
    </select>
    <button id="clear" title="Clear (Delete)">Clear</button>
    <button id="theme" class="icon">☾</button>
  </header>

  <div class="intercept-bar">
    <label><input type="checkbox" id="intc-toggle"> Intercept selected target</label>
    <input id="intc-host" placeholder="host (optional)">
    <input id="intc-method" placeholder="method">
    <input id="intc-url" placeholder="url contains">
    <span id="paused-strip" class="paused-strip"></span>
  </div>

  <main class="grid">
    <section class="col list-col">
      <div class="col-head">Requests <span id="count" class="muted"></span></div>
      <div id="list" class="rows"><div class="empty">Waiting for network activity…</div></div>
    </section>
    <section class="col timeline-col">
      <div class="col-head">Timeline</div>
      <div id="timeline" class="tl"><div class="empty">Select a request.</div></div>
    </section>
    <section class="col detail-col">
      <div class="tabs" id="detail-tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="request">Request</button>
        <button class="tab" data-tab="response">Response</button>
        <button class="tab" data-tab="diff">Diff</button>
        <button class="tab" data-tab="history">History</button>
      </div>
      <div id="detail" class="detail"><div class="empty">Select a request.</div></div>
    </section>
  </main>

  <footer id="editor" class="editor"><div class="empty">Select a request to replay, or a paused request to intercept.</div></footer>
  <script src="product.js"></script>
</body>
</html>
