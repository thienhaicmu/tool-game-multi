<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Authorized-use Web Security Observatory" />
  <title>Web Security Observatory</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">◈</div><div><strong>OBSERVATORY</strong><span>web security</span></div></div>
      <div class="scope-card"><div class="eyebrow">ACTIVE SCOPE</div><div class="scope-name">Staging / storefront</div><div class="scope-url">https://staging.example.com</div><div class="scope-status"><i></i> Passive only</div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview"><span>▦</span> Overview</button>
        <button class="nav-item" data-view="network"><span>⌁</span> Live Network <b class="nav-count">12</b></button>
        <button class="nav-item" data-view="findings"><span>△</span> Findings <b class="nav-count warn">6</b></button>
        <button class="nav-item" data-view="actions"><span>◎</span> Actions</button>
        <button class="nav-item" data-view="scope"><span>⊙</span> Scope &amp; policy</button>
      </nav>
      <div class="sidebar-foot"><div class="connection"><i></i><span>Capture engine connected</span></div><span class="version">v0.1.0 · local session</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">TEST SESSION / 08A7-21F4</div><h1 id="page-title">Overview</h1></div><div class="top-actions"><button class="icon-btn" title="Refresh" id="refresh">↻</button><button class="session-btn"><i></i> Capture running <span>▾</span></button><div class="avatar">AS</div></div></header>
      <div id="app"></div>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
